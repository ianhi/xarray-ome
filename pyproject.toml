[project]
name = "xarray-ngff"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # >=2026.1.0: earlier versions raise on selecting a lazy CoordinateTransform-
    # backed dim down to length 1 (size-1 axes / single z-slice), breaking rule 2.
    "xarray>=2026.1.0",
    "ngff-zarr>=0.37",
    # Zarr v3 only: the reader/writer target NGFF 0.5 (zarr.json / v3 layout) and
    # ngff-zarr>=0.37 itself requires v3. A 2.x floor was misleading -- nothing here
    # supports the v2 store format.
    "zarr>=3.0",
    "numpy>=1.24.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "s3fs>=2025.9.0",
    "matplotlib>=3.10.6",
    "ipympl>=0.9.7",
    "scipy>=1.17.1",
]

[project.entry-points."xarray.backends"]
ome-zarr = "xarray_ngff.backend:OmeZarrBackendEntrypoint"
ngff = "xarray_ngff.backend:OmeZarrBackendEntrypoint"

# ``ome-zarr-hypothesis`` (the property-test generator) is a sibling checkout.
[tool.uv.sources]
ome-zarr-hypothesis = { path = "../ome-zarr-hypothesis", editable = true }


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "python-simplified-semver"
local_scheme = "node-and-date"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["xarray_ngff"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
  "hatch-vcs>=0.5.0",
  "ipython>=9.6.0",
  "jupyter-cache>=1.0.1",
  "jupyterlab>=4.4.9",
  "jupyterlab-vim>=4.1.4",
  "mypy>=1.18.2",
  "myst-nb>=1.3.0",
  "pre-commit>=4.3.0",
  "hypothesis>=6.156",
  # Property-test generator (needs Python >=3.12); tests importorskip it, so a
  # 3.11 env simply skips the property suite while the package stays 3.11+.
  "ome-zarr-hypothesis; python_version >= '3.12'",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.13.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-book-theme>=1.1.4",
  "sphinx-design>=0.6.1",
  "sphinxcontrib-mermaid>=1.0.0",
]
docs = [
  "sphinx>=7.0.0",
  "myst-parser>=2.0.0",
  "sphinx-book-theme>=1.0.0",
  "sphinxcontrib-mermaid>=0.9.0",
  "sphinx-design>=0.5.0",
  "sphinx-autobuild>=2024.0.0",
]
